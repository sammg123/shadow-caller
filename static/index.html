# Direction contract

**THESIS.** The stadium is the interface: each call is projected on the turf pre-snap and scored on a SHADOW v LEAGUE scoreboard. Refuses the dark KPI-card dashboard.

**OWN-WORLD.** Night-blue bowl, lit striped turf, opaque LED panels showing unlit pixels, warm white and amber, flat steel, a scoreboard band in the offense's color, Big Shoulders, Doto at 40 px and up.

**STORY.** The call shows pre-snap, the ball flies through or past it, the score says whether the edge is real; Sam retags by key.

**FIRST VIEWPORT.** Bowl full bleed; play ribbon atop; video board upper right (416x324, call 40/64 px); desk beneath with the primary action (entry or retag keys); drive ribbon; scoreboard band (140 px).

**FORM.** Under the Lights, 5th on the resonance-ordered list; seed 748f193a; its own staging, adopting only the altitude idea of dealt staging spatial-navigation-tooling-by-zoom: blimp game, wide drive, tight snap.
-->
